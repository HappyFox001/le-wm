defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

# ---- token-level models (paper2: sparse residual JEPA) ----
# method: lewm (original CLS model) | token (model=tok_dense / tok_res / tok_g1)
method: lewm
g1:
  beta: 0.0025        # rate of opening one token, in units of rho^2
  enc_route: all      # all: closed tokens' residual |c|^2 also trains the encoder
  lam_dwarm: 1.0      # d fits the stop-grad change on all tokens (cold start)
  pos_weight: 4.0
  focus_weight: 1.0   # gate BCE weight, divided by the feature dim D
